<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طباعتي - تسجيل الدخول</title>

<style>
body{
margin:0;
background:#f4f7fb;
font-family:Arial,sans-serif;
color:#172033;
}

header{
background:white;
padding:20px;
box-shadow:0 2px 10px #0001;
}

.logo{
font-size:25px;
font-weight:bold;
color:#2563eb;
}

.box{
max-width:420px;
margin:50px auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px #0002;
}

h1{text-align:center}

label{
display:block;
font-weight:bold;
margin-top:18px;
margin-bottom:7px;
}

input{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
margin-top:20px;
padding:15px;
border:0;
border-radius:10px;
background:#2563eb;
color:white;
font-size:17px;
font-weight:bold;
}

#message{
margin-top:20px;
text-align:center;
line-height:1.6;
}
</style>
</head>

<body>

<header>
<div class="logo">🖨️ طباعتي</div>
</header>

<div class="box">

<h1>👤 حساب طباعتي</h1>

<label>البريد الإلكتروني</label>

<input
id="email"
type="email"
placeholder="example@email.com">

<label>كلمة المرور</label>

<input
id="password"
type="password"
placeholder="كلمة المرور">

<button onclick="register()">
إنشاء حساب
</button>

<button onclick="login()">
تسجيل الدخول
</button>

<div id="message"></div>

</div>

<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL =
"https://alzypsyxibcaftqxttui.supabase.co";

/*
ضع Publishable key هنا فقط.
لا تضع secret أو service_role.
*/

const SUPABASE_KEY =sb_publishable_qnAbX-La-ElvIKIyW9BNbA_PXU5IIV-
"الصق_المفتاح_العام_هنا";

const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const message =
document.getElementById("message");


window.register = async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;


if(!email || !password){

message.textContent =
"اكتب البريد وكلمة المرور.";

return;
}


const {error} =
await supabase.auth.signUp({
email:email,
password:password
});


if(error){

message.textContent =
"خطأ: " + error.message;

return;
}


message.textContent =
"✅ تم إنشاء الحساب. تحقق من بريدك الإلكتروني.";

};


window.login = async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;


if(!email || !password){

message.textContent =
"اكتب البريد وكلمة المرور.";

return;
}


const {error} =
await supabase.auth.signInWithPassword({
email:email,
password:password
});


if(error){

message.textContent =
"تعذر تسجيل الدخول: " +
error.message;

return;
}


message.textContent =
"✅ تم تسجيل الدخول بنجاح!";


setTimeout(function(){

window.location.href =
"print2.html";

},1000);

};

</script>

</body>
</html>
