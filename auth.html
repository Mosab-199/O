<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>طباعتي - تسجيل الدخول</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: white;
      padding: 18px 7%;
      box-shadow: 0 2px 10px #0001;
    }

    .logo {
      color: #2563eb;
      font-size: 25px;
      font-weight: bold;
    }

    .container {
      max-width: 430px;
      margin: 50px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 10px 30px #00000012;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #667085;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary {
      background: #eef4ff;
      color: #2563eb;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      line-height: 1.6;
    }

    .warning {
      margin-top: 20px;
      font-size: 12px;
      color: #667085;
      line-height: 1.7;
      text-align: center;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🖨️ طباعتي</div>
  </header>

  <div class="container">

    <div class="box">

      <h1>👤 حسابك</h1>

      <p class="subtitle">
        سجل الدخول أو أنشئ حسابًا جديدًا
      </p>

      <label for="email">البريد الإلكتروني</label>

      <input
        id="email"
        type="email"
        placeholder="example@email.com"
        autocomplete="email"
      >

      <label for="password">كلمة المرور</label>

      <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
        autocomplete="current-password"
      >

      <button id="signupBtn">
        إنشاء حساب
      </button>

      <button id="loginBtn" class="secondary">
        تسجيل الدخول
      </button>

      <div id="message"></div>

      <div class="warning">
        استخدم كلمة مرور خاصة بهذا الموقع.
        <br>
        لا تستخدم كلمة مرور حسابك البنكي أو بريدك الإلكتروني.
      </div>

    </div>

  </div>

  <script type="module">

    import { createClient }
      from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL =
      "https://alzypsyxibcaftqxttui.supabase.co";

    /*sb_publishable_qnAbX-La-ElvIKIyW9BNbA_PXU5IIV-
      ضع هنا نفس Publishable key الذي حصلت عليه
      من مشروع Supabase.
    */

    const SUPABASE_KEY =
    sb_publishable_qnAbX-La-ElvIKIyW9BNbA_PXU5IIV-";  

    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const message =
      document.getElementById("message");

    const signupBtn =
      document.getElementById("signupBtn");

    const loginBtn =
      document.getElementById("loginBtn");


    function showMessage(text, color) {

      message.textContent = text;
      message.style.color = color;

    }


    function getData() {

      return {
        email: emailInput.value.trim(),
        password: passwordInput.value
      };

    }


    signupBtn.addEventListener("click", async function() {

      const { email, password } = getData();

      if (!email || !password) {

        showMessage(
          "يرجى إدخال البريد الإلكتروني وكلمة المرور.",
          "#d92d20"
        );

        return;
      }

      if (password.length < 6) {

        showMessage(
          "كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
          "#d92d20"
        );

        return;
      }

      signupBtn.disabled = true;

      showMessage(
        "جاري إنشاء الحساب...",
        "#2563eb"
      );

      try {

        const { data, error } =
          await supabase.auth.signUp({
            email: email,
            password: password
          });

        if (error) {
          throw error;
        }

        if (data.session) {

          showMessage(
            "✅ تم إنشاء الحساب وتسجيل الدخول.",
            "#027a48"
          );

          setTimeout(function() {
            window.location.href = "print2.html";
          }, 1000);

        } else {

          showMessage(
            "✅ تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتأكيد الحساب.",
            "#027a48"
          );

        }

      } catch (error) {

        console.error(error);

        showMessage(
          "حدث خطأ: " + error.message,
          "#d92d20"
        );

      } finally {

        signupBtn.disabled = false;

      }

    });


    loginBtn.addEventListener("click", async function() {

      const { email, password } = getData();

      if (!email || !password) {

        showMessage(
          "أدخل البريد الإلكتروني وكلمة المرور أولاً.",
          "#d92d20"
        );

        return;
      }

      loginBtn.disabled = true;

      showMessage(
        "جاري تسجيل الدخول...",
        "#2563eb"
      );

      try {

        const { error } =
          await supabase.auth.signInWithPassword({
            email: email,
            password: password
          });

        if (error) {
          throw error;
        }

        showMessage(
          "✅ تم تسجيل الدخول بنجاح.",
          "#027a48"
        );

        setTimeout(function() {

          window.location.href =
            "print2.html";

        }, 1000);

      } catch (error) {

        console.error(error);

        showMessage(
          "تعذر تسجيل الدخول: " + error.message,
          "#d92d20"
        );

      } finally {

        loginBtn.disabled = false;

      }

    });

  </script>

</body>
</html>
