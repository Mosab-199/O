<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طباعتي - تسجيل الدخول</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f4f7fb;
  color: #172033;
}

header {
  background: white;
  padding: 18px 7%;
  box-shadow: 0 2px 10px #0001;
}

.logo {
  color: #2563eb;
  font-size: 25px;
  font-weight: bold;
}

.container {
  max-width: 430px;
  margin: 50px auto;
  padding: 20px;
}

.box {
  background: white;
  padding: 35px;
  border-radius: 20px;
  box-shadow: 0 10px 30px #00000012;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #667085;
  margin-bottom: 30px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d0d5dd;
  border-radius: 10px;
  margin-bottom: 18px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 12px;
}

.secondary {
  background: #eef4ff;
  color: #2563eb;
}

#message {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}

.warning {
  margin-top: 20px;
  font-size: 12px;
  color: #667085;
  line-height: 1.7;
  text-align: center;
}
</style>

</head>

<body>

<header>
  <div class="logo">🖨️ طباعتي</div>
</header>

<div class="container">

<div class="box">

<h1>👤 حسابك</h1>

<p class="subtitle">
سجل الدخول أو أنشئ حسابًا جديدًا
</p>

<label>البريد الإلكتروني</label>

<input
id="email"
type="email"
placeholder="example@email.com"
autocomplete="email"
>

<label>كلمة المرور</label>

<input
id="password"
type="password"
placeholder="كلمة المرور"
autocomplete="current-password"
>

<button onclick="signUp()">
إنشاء حساب
</button>

<button class="secondary" onclick="signIn()">
تسجيل الدخول
</button>

<div id="message"></div>

<div class="warning">
استخدم كلمة مرور خاصة بهذا الموقع.
<br>
لا تستخدم كلمة مرور حسابك البنكي أو بريدك الإلكتروني.
</div>

</div>

</div>


<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";


const SUPABASE_URL =
"https://alzypsyxibcaftqxttui.supabase.co";


/*
  ضع هنا Publishable key الجديد
  الخاص بمشروع Supabase.

  لا تضع service_role أو secret key.
*/

const SUPABASE_KEY =
"ضع_المفتاح_العام_هنا";


const supabase =
createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const message =
document.getElementById("message");


function getData() {

  return {
    email:
      document.getElementById("email").value.trim(),

    password:
      document.getElementById("password").value
  };

}


window.signUp = async function() {

  const { email, password } =
    getData();

  if (!email || !password) {

    message.textContent =
      "يرجى إدخال البريد وكلمة المرور.";

    message.style.color = "#d92d20";

    return;
  }

  if (password.length < 6) {

    message.textContent =
      "كلمة المرور يجب أن تكون 6 أحرف على الأقل.";

    message.style.color = "#d92d20";

    return;
  }


  message.textContent =
    "جاري إنشاء الحساب...";

  message.style.color = "#2563eb";


  const { error } =
    await supabase.auth.signUp({
      email: email,
      password: password
    });


  if (error) {

    message.textContent =
      "حدث خطأ: " + error.message;

    message.style.color = "#d92d20";

    return;
  }


  message.textContent =
    "✅ تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتأكيد الحساب.";

  message.style.color = "#027a48";

};


window.signIn = async function() {

  const { email, password } =
    getData();


  if (!email || !password) {

    message.textContent =
      "أدخل البريد وكلمة المرور أولاً.";

    message.style.color = "#d92d20";

    return;
  }


  message.textContent =
    "جاري تسجيل الدخول...";

  message.style.color = "#2563eb";


  const { error } =
    await supabase.auth.signInWithPassword({
      email: email,
      password: password
    });


  if (error) {

    message.textContent =
      "تعذر تسجيل الدخول: " +
      error.message;

    message.style.color = "#d92d20";

    return;
  }


  message.textContent =
    "✅ تم تسجيل الدخول.";

  message.style.color = "#027a48";


  setTimeout(() => {

    window.location.href =
      "print2.html";

  }, 1000);

};

</script>

</body>
</html>
