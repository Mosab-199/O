<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>طباعتي - النسخ</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #2563eb;
    }

    nav {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: #333;
    }

    nav a:hover {
      color: #2563eb;
    }

    .login {
      background: #2563eb;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      text-decoration: none;
    }

    .container {
      max-width: 850px;
      margin: 45px auto;
      padding: 20px;
    }

    .title {
      text-align: center;
      margin-bottom: 30px;
    }

    .title h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .title p {
      color: #667085;
      font-size: 18px;
    }

    .upload-box {
      background: white;
      border: 2px dashed #93b4f8;
      border-radius: 20px;
      padding: 45px 20px;
      text-align: center;
      cursor: pointer;
      transition: .2s;
    }

    .upload-box:hover {
      border-color: #2563eb;
      background: #f8faff;
    }

    .upload-icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .upload-box h2 {
      margin-bottom: 10px;
    }

    .upload-box p {
      color: #667085;
      margin-bottom: 20px;
    }

    .upload-button {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 13px 25px;
      border-radius: 11px;
      font-weight: bold;
    }

    #fileInput {
      display: none;
    }

    .files {
      margin-top: 25px;
      display: grid;
      gap: 15px;
    }

    .file-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 5px 18px rgba(0,0,0,.05);
    }

    .preview {
      width: 75px;
      height: 75px;
      border-radius: 10px;
      background: #eef4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-size: 32px;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-weight: bold;
      margin-bottom: 7px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-size {
      color: #667085;
      font-size: 14px;
    }

    .copies {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .copies input {
      width: 70px;
      padding: 8px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      text-align: center;
    }

    .delete {
      background: #fee2e2;
      color: #dc2626;
      border: 0;
      padding: 9px 12px;
      border-radius: 9px;
      cursor: pointer;
    }

    .summary {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-top: 25px;
      box-shadow: 0 5px 18px rgba(0,0,0,.05);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      color: #475467;
    }

    .summary-row strong {
      color: #172033;
    }

    .action {
      width: 100%;
      border: 0;
      background: #2563eb;
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    .action:hover {
      background: #1d4ed8;
    }

    .action:disabled {
      background: #98a2b3;
      cursor: not-allowed;
    }

    .empty {
      text-align: center;
      color: #667085;
      padding: 25px;
      background: white;
      border-radius: 16px;
      margin-top: 20px;
    }

    footer {
      margin-top: 60px;
      background: #172033;
      color: white;
      text-align: center;
      padding: 25px;
    }

    @media (max-width: 650px) {

      header {
        padding: 15px 5%;
      }

      nav {
        display: none;
      }

      .title h1 {
        font-size: 31px;
      }

      .file-card {
        align-items: flex-start;
      }

      .preview {
        width: 60px;
        height: 60px;
      }

      .delete {
        align-self: center;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    🖨️ طباعتي
  </div>

  <nav>
    <a href="index.html">الرئيسية</a>
    <a href="print2.html">الطباعة</a>
    <a href="copy.html">النسخ</a>
    <a href="profile.html">حسابي</a>
  </nav>

  <a class="login" href="auth.html">
    تسجيل الدخول
  </a>

</header>


<main class="container">

  <div class="title">

    <h1>
      📋 نسخ ملفاتك
    </h1>

    <p>
      ارفع ملفات PDF أو الصور وحدد عدد النسخ التي تريدها.
    </p>

  </div>


  <label class="upload-box" for="fileInput">

    <div class="upload-icon">
      📁
    </div>

    <h2>
      اختر ملفاتك
    </h2>

    <p>
      PDF أو JPG أو PNG أو WEBP
    </p>

    <span class="upload-button">
      اختيار الملفات
    </span>

  </label>

  <input
    id="fileInput"
    type="file"
    accept=".pdf,image/jpeg,image/png,image/webp"
    multiple
  >


  <div id="files" class="files"></div>


  <div id="empty" class="empty">
    لم تتم إضافة أي ملفات بعد.
  </div>


  <div class="summary">

    <div class="summary-row">
      <span>عدد الملفات</span>
      <strong id="fileCount">0</strong>
    </div>

    <div class="summary-row">
      <span>إجمالي النسخ</span>
      <strong id="copyCount">0</strong>
    </div>

    <button
      id="continueBtn"
      class="action"
      disabled
    >
      متابعة
    </button>

  </div>

</main>


<footer>
  © 2026 طباعتي — اطبع واشترك
</footer>


<script>

  const fileInput =
    document.getElementById("fileInput");

  const filesContainer =
    document.getElementById("files");

  const empty =
    document.getElementById("empty");

  const fileCount =
    document.getElementById("fileCount");

  const copyCount =
    document.getElementById("copyCount");

  const continueBtn =
    document.getElementById("continueBtn");


  let selectedFiles = [];


  // تحويل حجم الملف إلى صيغة مناسبة
  function formatSize(bytes) {

    if (bytes < 1024)
      return bytes + " B";

    if (bytes < 1024 * 1024)
      return (bytes / 1024).toFixed(1) + " KB";

    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
  }


  // إضافة الملفات
  fileInput.addEventListener(
    "change",
    function () {

      const newFiles =
        Array.from(fileInput.files);

      newFiles.forEach(file => {

        const exists =
          selectedFiles.some(
            item =>
              item.file.name === file.name &&
              item.file.size === file.size
          );

        if (!exists) {

          selectedFiles.push({

            file: file,

            copies: 1

          });

        }

      });


      fileInput.value = "";

      renderFiles();

    }
  );


  // عرض الملفات
  function renderFiles() {

    filesContainer.innerHTML = "";

    fileCount.textContent =
      selectedFiles.length;


    let totalCopies = 0;


    selectedFiles.forEach(
      (item, index) => {

        totalCopies += item.copies;


        const card =
          document.createElement("div");

        card.className = "file-card";


        const preview =
          document.createElement("div");

        preview.className = "preview";


        if (item.file.type.startsWith("image/")) {

          const img =
            document.createElement("img");

          img.src =
            URL.createObjectURL(item.file);

          preview.appendChild(img);

        } else {

          preview.textContent = "📄";

        }


        const info =
          document.createElement("div");

        info.className = "file-info";


        const name =
          document.createElement("div");

        name.className = "file-name";

        name.textContent =
          item.file.name;


        const size =
          document.createElement("div");

        size.className = "file-size";

        size.textContent =
          formatSize(item.file.size);


        const copies =
          document.createElement("div");

        copies.className = "copies";


        const label =
          document.createElement("span");

        label.textContent =
          "عدد النسخ:";


        const input =
          document.createElement("input");

        input.type = "number";

        input.min = "1";

        input.max = "100";

        input.value = item.copies;


        input.addEventListener(
          "change",
          function () {

            let value =
              parseInt(input.value);


            if (
              isNaN(value) ||
              value < 1
            ) {

              value = 1;

            }


            if (value > 100) {

              value = 100;

            }


            item.copies = value;

            input.value = value;

            renderFiles();

          }
        );


        copies.appendChild(label);
        copies.appendChild(input);


        info.appendChild(name);
        info.appendChild(size);
        info.appendChild(copies);


        const deleteBtn =
          document.createElement("button");

        deleteBtn.className = "delete";

        deleteBtn.textContent =
          "حذف";


        deleteBtn.addEventListener(
          "click",
          function () {

            selectedFiles.splice(index, 1);

            renderFiles();

          }
        );


        card.appendChild(preview);
        card.appendChild(info);
        card.appendChild(deleteBtn);


        filesContainer.appendChild(card);

      }
    );


    copyCount.textContent =
      totalCopies;


    if (selectedFiles.length === 0) {

      empty.style.display = "block";

      continueBtn.disabled = true;

    } else {

      empty.style.display = "none";

      continueBtn.disabled = false;

    }

  }


  // زر المتابعة
  continueBtn.addEventListener(
    "click",
    function () {

      if (selectedFiles.length === 0) {

        return;

      }


      alert(
        "تم تجهيز " +
        selectedFiles.length +
        " ملفًا بإجمالي " +
        copyCount.textContent +
        " نسخة."
      );

    }
  );


  renderFiles();

</script>

</body>
</html>
