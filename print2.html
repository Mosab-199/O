<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طباعتي - اطبع ملفك</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f4f7fb;
  color: #172033;
}

header {
  background: white;
  padding: 18px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 10px #00000012;
}

.logo {
  color: #2563eb;
  font-size: 25px;
  font-weight: bold;
}

.back {
  color: #2563eb;
  text-decoration: none;
}

.container {
  max-width: 900px;
  margin: 35px auto;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #667085;
  margin-bottom: 30px;
}

.upload {
  background: white;
  border: 2px dashed #2563eb;
  border-radius: 20px;
  padding: 45px 20px;
  text-align: center;
  cursor: pointer;
}

.upload:hover {
  background: #f0f6ff;
}

.upload-icon {
  font-size: 55px;
}

.upload h2 {
  margin: 12px 0;
}

.upload p {
  color: #667085;
}

#fileInput {
  display: none;
}

.file-info {
  display: none;
  background: white;
  padding: 20px;
  border-radius: 15px;
  margin-top: 20px;
}

.preview {
  display: none;
  margin-top: 20px;
  background: #e9edf5;
  padding: 15px;
  border-radius: 15px;
}

.preview iframe {
  width: 100%;
  height: 500px;
  border: none;
  background: white;
  border-radius: 10px;
}

.settings {
  display: none;
  margin-top: 20px;
  background: white;
  padding: 25px;
  border-radius: 15px;
}

.settings h2 {
  margin-top: 0;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.field {
  margin-bottom: 18px;
}

.field label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

select,
input {
  width: 100%;
  padding: 13px;
  border: 1px solid #d0d5dd;
  border-radius: 10px;
  font-size: 16px;
  background: white;
}

.print-button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #2563eb;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.print-button:hover {
  background: #1d4ed8;
}

.status {
  display: none;
  margin-top: 15px;
  padding: 15px;
  background: #ecfdf3;
  color: #027a48;
  border-radius: 10px;
  text-align: center;
}

@media(max-width:650px) {
  .grid {
    grid-template-columns: 1fr;
  }

  .preview iframe {
    height: 400px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    🖨️ طباعتي
  </div>

  <a class="back" href="index.html">
    الرئيسية
  </a>

</header>

<div class="container">

  <h1>📄 اطبع ملفك</h1>

  <p class="subtitle">
    اختر ملف PDF واضبط إعدادات الطباعة
  </p>

  <label class="upload" for="fileInput">

    <div class="upload-icon">📄</div>

    <h2>اختر ملف PDF</h2>

    <p>
      اضغط هنا لاختيار ملف من جهازك
    </p>

  </label>

  <input
    id="fileInput"
    type="file"
    accept="application/pdf"
  >

  <div class="file-info" id="fileInfo">

    <strong>اسم الملف:</strong>
    <span id="fileName"></span>

    <br><br>

    <strong>حجم الملف:</strong>
    <span id="fileSize"></span>

  </div>

  <div class="preview" id="preview">

    <h2>👁️ معاينة الملف</h2>

    <iframe id="pdfPreview"></iframe>

  </div>

  <div class="settings" id="settings">

    <h2>⚙️ إعدادات الطباعة</h2>

    <div class="grid">

      <div class="field">

        <label>
          حجم الورق
        </label>

        <select id="paper">

          <option>A4</option>
          <option>A5</option>
          <option>A3</option>
          <option>Letter</option>

        </select>

      </div>

      <div class="field">

        <label>
          عدد النسخ
        </label>

        <input
          id="copies"
          type="number"
          value="1"
          min="1"
          max="100"
        >

      </div>

      <div class="field">

        <label>
          اللون
        </label>

        <select id="color">

          <option value="bw">
            ⚫ أبيض وأسود
          </option>

          <option value="color">
            🌈 ملون
          </option>

        </select>

      </div>

      <div class="field">

        <label>
          الوجه
        </label>

        <select id="duplex">

          <option>
            وجه واحد
          </option>

          <option>
            وجهين
          </option>

        </select>

      </div>

    </div>

    <button
      class="print-button"
      id="printButton"
    >
      🖨️ طباعة الآن
    </button>

    <div class="status" id="status">
      سيتم فتح نافذة الطباعة...
    </div>

  </div>

</div>

<script type="module">

import {
  createClient
} from "https://esm.sh/@supabase/supabase-js@2";


const SUPABASE_URL =
  "https://alzypsyxibcaftqxttui.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_qnAbX-La-ElvIKIyW9BNbA_PXU5IIV-";


const supabase =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let selectedFile = null;


const fileInput =
  document.getElementById("fileInput");


const printButton =
  document.getElementById("printButton");


fileInput.addEventListener(
  "change",
  function () {

    const file =
      this.files[0];

    if (!file) return;


    if (
      file.type !==
      "application/pdf"
    ) {

      alert(
        "يرجى اختيار ملف PDF فقط."
      );

      this.value = "";

      return;
    }


    if (
      file.size >
      20 * 1024 * 1024
    ) {

      alert(
        "الحد الأقصى لحجم الملف هو 20MB."
      );

      this.value = "";

      return;
    }


    selectedFile =
      file;


    document.getElementById(
      "fileName"
    ).textContent =
      file.name;


    document.getElementById(
      "fileSize"
    ).textContent =
      (
        file.size /
        1024 /
        1024
      ).toFixed(2) +
      " MB";


    document.getElementById(
      "fileInfo"
    ).style.display =
      "block";


    document.getElementById(
      "settings"
    ).style.display =
      "block";


    const fileURL =
      URL.createObjectURL(
        file
      );


    document.getElementById(
      "pdfPreview"
    ).src =
      fileURL;


    document.getElementById(
      "preview"
    ).style.display =
      "block";

  }
);


async function startPrint() {

  if (!selectedFile) {

    alert(
      "اختر ملف PDF أولاً."
    );

    return;
  }


  const copies =
    parseInt(
      document.getElementById(
        "copies"
      ).value
    );


  if (
    copies < 1 ||
    copies > 100
  ) {

    alert(
      "عدد النسخ يجب أن يكون بين 1 و100."
    );

    return;
  }


  const {
    data: {
      session
    }
  } =
    await supabase.auth.getSession();


  if (!session) {

    alert(
      "يجب تسجيل الدخول أولاً."
    );

    window.location.href =
      "auth.html";

    return;
  }


  document.getElementById(
    "status"
  ).style.display =
    "block";


  document.getElementById(
    "status"
  ).textContent =
    "جاري فتح نافذة الطباعة...";


  const url =
    URL.createObjectURL(
      selectedFile
    );


  const printWindow =
    window.open(
      url,
      "_blank"
    );


  if (!printWindow) {

    document.getElementById(
      "status"
    ).style.display =
      "none";


    alert(
      "المتصفح منع نافذة الطباعة. اسمح بالنوافذ المنبثقة للموقع."
    );

    return;
  }


  const {
    error
  } =
    await supabase
      .from("operations")
      .insert({

        user_id:
          session.user.id,

        type:
          "print",

        file_name:
          selectedFile.name,

        copies:
          copies,

        status:
          "completed"

      });


  if (error) {

    console.error(
      "Operation insert error:",
      error
    );

    document.getElementById(
      "status"
    ).textContent =
      "تم فتح الطباعة، لكن تعذر حفظ العملية في السجل.";

    return;
  }


  document.getElementById(
    "status"
  ).textContent =
    "تم تسجيل عملية الطباعة في السجل ✅";

}


printButton.addEventListener(
  "click",
  startPrint
);

</script>

</body>
</html>
