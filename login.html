<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>طباعتي - الدخول والاشتراك</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f4f7fb;
  color: #172033;
}

header {
  background: white;
  padding: 18px 7%;
  box-shadow: 0 2px 10px #0001;
}

.logo {
  color: #2563eb;
  font-size: 25px;
  font-weight: bold;
}

.container {
  max-width: 450px;
  margin: 50px auto;
  padding: 20px;
}

.box {
  background: white;
  padding: 35px;
  border-radius: 20px;
  box-shadow: 0 10px 30px #00000012;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #667085;
  margin-bottom: 30px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d0d5dd;
  border-radius: 10px;
  margin-bottom: 18px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #2563eb;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.plan {
  background: #eff6ff;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 20px;
  text-align: center;
}

.price {
  font-size: 30px;
  font-weight: bold;
  color: #2563eb;
}

.note {
  margin-top: 20px;
  text-align: center;
  color: #667085;
  font-size: 13px;
  line-height: 1.7;
}

</style>

</head>

<body>

<header>

<div class="logo">
🖨️ طباعتي
</div>

</header>


<div class="container">

<div class="box">

<h1>
إنشاء حساب
</h1>

<p class="subtitle">
أنشئ حسابك وابدأ استخدام طباعتي
</p>


<div class="plan">

<div>
اشتراك طباعتي
</div>

<div class="price">
$10
</div>

<div>
شهريًا
</div>

</div>


<label>
الاسم
</label>

<input
type="text"
id="name"
placeholder="اكتب اسمك">


<label>
البريد الإلكتروني
</label>

<input
type="email"
id="email"
placeholder="example@email.com">


<label>
كلمة المرور
</label>

<input
type="password"
id="password"
placeholder="كلمة المرور">


<button onclick="createAccount()">
إنشاء الحساب
</button>


<div class="note">

هذه نسخة تجريبية من صفحة التسجيل.
<br>

سيتم لاحقًا ربط الحسابات وقاعدة البيانات
ونظام الدفع الحقيقي.

</div>

</div>

</div>


<script>

function createAccount() {

const name =
document.getElementById("name").value;

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;


if (!name || !email || !password) {

alert("يرجى تعبئة جميع الحقول.");

return;

}


if (password.length < 6) {

alert("كلمة المرور يجب أن تكون 6 أحرف على الأقل.");

return;

}


alert(
"تم إنشاء الحساب التجريبي بنجاح!"
);


window.location.href =
"print2.html";

}

</script>

</body>

</html>
